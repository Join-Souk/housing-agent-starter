<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Housing Agent</title>

<!-- Beautiful UI's compiled stylesheet. See README.md for attribution. -->
<link rel="stylesheet" href="/bui.css" />

<style>
  html, body { height: 100% }
  body { display: flex; align-items: center; justify-content: center; padding: 24px }
  #root { width: 100%; max-width: 760px }
  .chat-shell { height: min(86dvh, 760px); min-height: 420px }
</style>

<script type="importmap">
{ "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
// Babel's React preset compiles JSX to React.createElement, so the default
// import must remain in scope.
import React, { useEffect, useRef, useState } from "react";
import { createRoot } from "react-dom/client";

/* The chat shell adapts Beautiful UI's ChatComposer component. */
function Chat() {
  const [items, setItems] = useState([
    { kind: "agent", text: "Hi — I can help you find a place in Leeds. What are you looking for?" },
  ]);
  const [history, setHistory] = useState([]);
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);
  const feedRef = useRef(null);

  useEffect(() => {
    if (feedRef.current) feedRef.current.scrollTop = feedRef.current.scrollHeight;
  }, [items, busy]);

  const canSend = draft.trim().length > 0 && !busy;

  const send = async () => {
    if (!canSend) return;
    const text = draft.trim();
    setDraft("");
    setBusy(true);
    setItems((current) => [...current, { kind: "user", text }]);
    const messages = [...history, { role: "user", content: text }];

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        setItems((current) => [
          ...current,
          { kind: "agent", text: "Error: " + (data.error || "Request failed") },
        ]);
      } else {
        setItems((current) => [...current, { kind: "agent", text: data.text }]);
        setHistory([...messages, { role: "assistant", content: data.text }]);
      }
    } catch (error) {
      setItems((current) => [
        ...current,
        { kind: "agent", text: "Network error: " + error.message },
      ]);
    } finally {
      setBusy(false);
      inputRef.current?.focus();
    }
  };

  return (
    <div className="chat-shell flex w-full flex-col overflow-hidden rounded-[14px] bg-surface shadow-card">
      <div className="flex shrink-0 items-center justify-between border-b border-line p-1.5">
        <div className="flex items-center">
          <span className="rounded-[6px] bg-field px-2 py-[3px] text-[13px] text-ink">Find a place</span>
          <span className="px-2 py-[3px] text-[13px] text-ink opacity-50">Leeds student housing</span>
        </div>
        <span className="px-1.5 font-mono text-[11px] text-ink-3">starter</span>
      </div>

      <div ref={feedRef} className="flex min-h-0 flex-1 flex-col gap-2.5 overflow-y-auto px-3 pt-2.5 pb-1">
        {items.map((item, index) =>
          item.kind === "user" ? (
            <div key={index} className="flex justify-end pl-14">
              <div
                className="rounded-xl bg-field px-3 py-1.5 text-[13px] leading-[1.4] text-ink"
                style={{ animation: "fade-up 300ms cubic-bezier(0.23,1,0.32,1) both" }}
              >
                {item.text}
              </div>
            </div>
          ) : (
            <p
              key={index}
              className="text-[13px] leading-normal whitespace-pre-wrap text-ink"
              style={{ animation: "fade-up 400ms cubic-bezier(0.23,1,0.32,1) both" }}
            >
              {item.text}
            </p>
          )
        )}
        {busy && (
          <span
            className="text-[12px] text-ink-3"
            style={{ animation: "fade-in 300ms ease-out both" }}
          >
            Working…
          </span>
        )}
      </div>

      <div className="mt-auto shrink-0 p-1.5">
        <div
          role="presentation"
          onClick={() => inputRef.current?.focus()}
          className="flex cursor-text flex-col gap-2 rounded-control border border-line bg-field p-2.5 shadow-[0_1px_2px_rgba(0,0,0,0.035)] transition-[border-color,box-shadow] duration-150 focus-within:border-line-strong"
        >
          <input
            ref={inputRef}
            value={draft}
            onChange={(event) => setDraft(event.target.value)}
            onKeyDown={(event) => { if (event.key === "Enter") send(); }}
            placeholder="Tell me what you're looking for"
            aria-label="Chat prompt"
            className="min-h-4.5 bg-transparent text-[13px] leading-[1.4] text-ink outline-none placeholder:text-ink-3"
          />
          <div className="flex items-center justify-end">
            <button
              type="button"
              aria-label="Send"
              disabled={!canSend}
              onClick={send}
              className="flex size-7 items-center justify-center rounded-[8px] transition-[background-color,color,transform] duration-200 enabled:active:scale-[0.96]"
              style={{
                background: canSend ? "var(--ink)" : "var(--line-strong)",
                color: canSend ? "var(--surface)" : "var(--ink-2)",
              }}
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<Chat />);
</script>
</body>
</html>
